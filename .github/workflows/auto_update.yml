name: Auto Sync Catalog from Google Sheet

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every single hour to pull updates
  workflow_dispatch:   # Dynamically adds a manual "Sync Now" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run Google Sheet Sync Script
      run: python update_catalog.py

    - name: Commit and Push Updated JSON
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add products.json
        # Only commits if the Google Sheet data actually changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Synced products.json with live Google Sheet" && git push)
