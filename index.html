<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click n Pick | IIML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-icons/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-10">

    <header class="bg-yellow-400 sticky top-0 z-40 shadow-md px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-black">⚡ Click n Pick <span class="text-xs bg-black text-white px-2 py-0.5 rounded">IIML</span></h1>
            <button onclick="toggleCart()" class="bg-black text-white px-4 py-2 rounded-lg font-bold flex gap-2 items-center">
                <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

 <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-yellow-400 mb-4"></i>
                <p class="text-gray-500 font-medium">Loading campus essentials...</p>
            </div>
        </div>
    </main>

    <div id="cart-sidebar" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm">
        <div class="fixed right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col p-6">
            <div class="flex justify-between border-b pb-4 mb-4">
                <h3 class="text-xl font-bold">Your Cart</h3>
                <button onclick="toggleCart()" class="text-2xl font-bold text-gray-500 hover:text-black">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow overflow-y-auto space-y-4"></div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span>₹<span id="cart-total">0</span></span>
                </div>
                <button onclick="openCheckout()" id="checkout-btn" class="w-full bg-yellow-400 py-3 rounded-xl font-bold disabled:opacity-50" disabled>Checkout</button>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/70 z-50 hidden overflow-y-auto p-4 flex items-center justify-center">
        <div class="bg-white rounded-xl max-w-xl w-full p-6 relative my-8">
            <button onclick="closeCheckout()" class="absolute right-4 top-4 text-2xl text-gray-400 hover:text-black">&times;</button>
            <h3 class="text-2xl font-bold mb-4">Complete Order</h3>
            
            <form id="order-form" onsubmit="handleCheckout(event)" class="space-y-4">
                <div class="bg-gray-100 p-4 rounded-lg text-center border-2 border-dashed border-gray-300">
                    <p class="font-bold text-lg text-green-700 mb-2">Scan to Pay: ₹<span id="modal-total">0</span></p>
                    <img src="QR.jpeg" alt="UPI QR" class="w-40 h-40 mx-auto rounded border" >
            
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2"><input type="text" name="name" placeholder="Full Name" required class="w-full border p-2 rounded outline-none focus:border-yellow-400"></div>
                    <div><input type="tel" name="phone" placeholder="Contact Number" required class="w-full border p-2 rounded outline-none focus:border-yellow-400"></div>
                    <div><input type="text" name="hostel" placeholder="Hostel Number" required class="w-full border p-2 rounded outline-none focus:border-yellow-400"></div>
                    <div><input type="text" name="room" placeholder="Room Number" required class="w-full border p-2 rounded outline-none focus:border-yellow-400"></div>
                    <div>
                        <select name="fulfillment" required class="w-full border p-2 rounded outline-none focus:border-yellow-400 bg-white">
                            <option value="">Select Delivery Option</option>
                            <option value="Delivery to Room">Delivery to Room</option>
                            <option value="Self-Pickup">Self-Pickup</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Arrival Date</label>
                        <input type="date" name="arrivalDate" required class="w-full border p-2 rounded outline-none focus:border-yellow-400">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Arrival Time</label>
                        <input type="time" name="arrivalTime" required class="w-full border p-2 rounded outline-none focus:border-yellow-400">
                    </div>
                </div>

                <div class="border-t pt-4">
                    <input type="text" name="txnId" placeholder="UPI Transaction ID (12 Digits)" pattern="[0-9]{12,}" required class="w-full border p-2 rounded outline-none focus:border-yellow-400 mb-4">
                    <label class="block text-sm font-bold mb-1">Upload Payment Screenshot</label>
                    <input type="file" id="screenshot" accept="image/*" required class="w-full text-sm border p-2 rounded">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">Submit Order & Payment Proof</button>
            </form>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {};
        
        // IMPORTANT: PASTE YOUR GOOGLE SCRIPT URL HERE LATER
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpNLVN3UEOuAUH9tGS9pey2SIs9YDfjCPqAz_NhulIFJ1GDCB8ppoLH6FzwPw-XnLd/exec';

        async function init() {
            try {
                const res = await fetch('products.json');
                products = await res.json();
                renderProducts();
            } catch(e) {
                console.error("Failed to load products", e);
            }
        }

   function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow border overflow-hidden flex flex-col transition hover:shadow-lg">
                    <div class="h-40 bg-gray-100 flex items-center justify-center relative">
                        ${p.image ? `<img src="${p.image}" loading="lazy" alt="${p.name}" class="w-full h-full object-cover">` : `<i class="fas fa-box text-4xl text-gray-300"></i>`}
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg leading-tight mb-1">${p.name}</h3>
                            <p class="text-sm text-gray-500 line-clamp-2 mb-2">${p.description}</p>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="font-black text-lg text-gray-900">₹${p.price}</span>
                            ${cart[p.id] ? 
                                `<div class="flex items-center bg-yellow-400 rounded-lg font-bold shadow-sm">
                                    <button onclick="updateQty('${p.id}', -1)" class="px-3 py-1 hover:bg-yellow-500 transition rounded-l-lg">-</button>
                                    <span class="px-2">${cart[p.id]}</span>
                                    <button onclick="updateQty('${p.id}', 1)" class="px-3 py-1 hover:bg-yellow-500 transition rounded-r-lg">+</button>
                                </div>` :
                                `<button onclick="updateQty('${p.id}', 1)" class="border-2 border-yellow-400 text-black px-4 py-1 rounded-lg font-bold hover:bg-yellow-400 transition">ADD</button>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if(cart[id] <= 0) delete cart[id];
            updateCart();
            renderProducts();
        }

        function updateCart() {
            const itemsDiv = document.getElementById('cart-items');
            let count = 0, total = 0, html = '';

            for(let id in cart) {
                const p = products.find(x => x.id === id);
                if(!p) continue;
                count += cart[id];
                total += p.price * cart[id];
                html += `<div class="flex justify-between border-b pb-2"><div class="text-sm"><p class="font-bold">${p.name}</p><p class="text-gray-500">₹${p.price} x ${cart[id]}</p></div><span class="font-bold">₹${p.price * cart[id]}</span></div>`;
            }

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('modal-total').innerText = total;
            itemsDiv.innerHTML = html || '<p class="text-center text-gray-400 mt-10">Cart is empty</p>';
            document.getElementById('checkout-btn').disabled = count === 0;
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('hidden'); }
        function openCheckout() { toggleCart(); document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }

        async function handleCheckout(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Processing... Do not close window.";

            const form = new FormData(e.target);
            const file = document.getElementById('screenshot').files[0];
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                
                let summary = [];
                let finalTotal = 0;
                for(let id in cart) {
                    const p = products.find(x => x.id === id);
                    summary.push(`${p.name} (${cart[id]})`);
                    finalTotal += p.price * cart[id];
                }

               

                const payload = {
                    name: form.get('name'), phone: form.get('phone'),
                    hostel: form.get('hostel'), room: form.get('room'),
                    fulfillment: form.get('fulfillment'),
                    arrivalDate: form.get('arrivalDate'), arrivalTime: form.get('arrivalTime'),
                    txnId: form.get('txnId'), orderSummary: summary.join(', '),
                    totalAmount: finalTotal, imageName: file.name, imageBuffer: base64
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    // This waits for the Google Script to reply with the exact Excel Order ID
                    const result = await response.json();
                    const OrderID=result.uniqueOrderId;

                    if (result.status === 'success') {
                        //  This alert now uses the exact ID saved in Excel (result.orderId)
                        alert("Order placed successfully! Your Order ID is #" + OrderID + ". We will verify the payment.");
                        cart = {}; updateCart(); renderProducts(); closeCheckout(); e.target.reset();
                    } else {
                        alert("There was an issue processing your order. Please try again.");
                        console.error(result.error);
                    }

                } catch (err) {
                    alert("Submission failed. Please check your internet connection.");
                    console.error(err);
                } finally {
                    btn.disabled = false; btn.innerText = "Submit Order & Payment Proof";
                }
            };
        }
        window.onload = init;
    </script>
</body>
</html>
